<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Activities · IMM Lab</title>
<meta name="description" content="Conferences, workshops and lab events of the Immersive Media Lab, Sejong University.">
<link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:32px}
.act{aspect-ratio:4/5;border-radius:28px;position:relative;overflow:hidden;color:#fff;padding:28px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .35s var(--ease),opacity .35s;animation:fade .6s var(--ease) both}
.act:hover{transform:translateY(-6px)}
.act img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;transition:transform .8s var(--ease)}
.act:hover img{transform:scale(1.05)}
.act::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.45));z-index:0}
.act>*{position:relative;z-index:1}
.act .k{font-size:13px;font-weight:700;opacity:.85;display:flex;justify-content:space-between}
.act h4{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.act .meta{font-size:15px;opacity:.9;margin-top:8px;font-weight:600}
.act .big{position:absolute;right:-12px;top:44px;font-size:160px;font-weight:900;letter-spacing:-.06em;opacity:.14;line-height:1;z-index:0;transition:transform .8s var(--ease)}
.act:hover .big{transform:translateX(-16px)}
.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
@media (max-width:1020px){ .acts{grid-template-columns:repeat(2,1fr)} }
@media (max-width:600px){ .acts{grid-template-columns:1fr} .act{aspect-ratio:5/4} }
</style>
</head>
<body data-page="activities">
<main>
  <section class="page-hero">
    <div class="blob b1"></div><div class="blob b2"></div>
    <div class="wrap">
      <span class="eyebrow">Activities</span>
      <h1><span class="line"><span>At conferences,</span></span><span class="line"><span class="grad">and beyond the lab.</span></span></h1>
      <p class="lead">Where we've presented, learned, and recharged together.</p>
    </div>
  </section>

  <section style="padding-bottom:120px">
    <div class="wrap">
      <div class="tools reveal">
        <div class="seg" id="kindSeg"><span class="thumb"></span><button class="on" data-k="">All</button><button data-k="Conference">Conferences</button><button data-k="Lab">Lab events</button></div>
        <div class="chips" id="yearChips"></div>
      </div>
      <div class="acts" id="acts"></div>
    </div>
  </section>

  <section data-cta style="padding-top:0"></section>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/common.js"></script>
<script>
const A = LAB.activities.map(a => ({...a, y: (a.d.match(/\d{4}/)||[""])[0]}));
const F = {k:"", y:null};
seg($("#kindSeg"), b => { F.k = b.dataset.k; render(); });
chips($("#yearChips"), [...new Set(A.map(a => a.y))].map(y => [y, y]), v => { F.y = v; render(); }, "All years");
function render(){
  const list = A.filter(a => (!F.k || a.k === F.k) && (!F.y || a.y === F.y));
  $("#acts").innerHTML = list.length ? list.map((a,i) => `
    <div class="act" style="background:linear-gradient(150deg,${a.g[0]},${a.g[1]} 55%,${a.g[2]});animation-delay:${i*60}ms">
      ${a.img ? `<img src="${esc(a.img)}" alt="${esc(a.t)}" loading="lazy">` : ""}
      <span class="big">'${esc(a.y.slice(2))}</span>
      <span class="k"><span>${esc(a.k)}</span></span>
      <div><h4>${esc(a.t)}</h4><div class="meta">${esc(a.d)}<br>${esc(a.p)}</div></div>
    </div>`).join("") : `<div class="empty" style="grid-column:1/-1">Nothing here yet.</div>`;
}
render();
</script>
</body>
</html>
