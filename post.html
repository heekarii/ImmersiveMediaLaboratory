<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blog · IMM Lab</title>
<meta name="description" content="Lab life and research stories from the Immersive Media Lab, Sejong University.">
<link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
.post-wrap{max-width:760px;margin:0 auto;padding-inline:24px}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--sub);font-size:15px;padding:8px 0}
.back:hover{color:var(--blue)}
.post-head{padding-block:120px 0;animation:fade .7s var(--ease) both}
.post-head h1{font-size:clamp(32px,5vw,52px);font-weight:800;letter-spacing:-.04em;line-height:1.18;margin:16px 0 24px}
.post-head .meta{display:flex;align-items:center;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:14px;font-weight:600}
.post-cover{margin:40px 0 0;border-radius:28px;overflow:hidden;background:var(--bg-2)}
.post-cover img{width:100%;height:auto;max-height:70vh;object-fit:cover}
.draft-note{margin-top:24px;background:#fff4e0;color:#8a5300;border-radius:14px;padding:12px 16px;font-weight:600;font-size:14px}

/* article typography */
.prose{margin-top:48px;font-size:18px;line-height:1.8;color:var(--text-2);word-break:keep-all;overflow-wrap:anywhere}
.prose>*+*{margin-top:1.1em}
.prose h2{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.3;color:var(--text);margin-top:2em}
.prose h3{font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--text);margin-top:1.8em}
.prose h4{font-size:18px;font-weight:800;color:var(--text);margin-top:1.5em}
.prose a{color:var(--blue);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.prose strong{color:var(--text);font-weight:700}
.prose ul,.prose ol{padding-left:1.4em}
.prose li+li{margin-top:.4em}
.prose li::marker{color:var(--muted)}
.prose blockquote{border-left:4px solid var(--blue);background:var(--blue-soft);border-radius:0 14px 14px 0;padding:14px 20px;color:var(--text-2)}
.prose code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86em;background:var(--bg-2);padding:2px 6px;border-radius:6px}
.prose pre{background:var(--ink);color:#e6edf7;border-radius:16px;padding:18px 20px;overflow-x:auto;font-size:14px;line-height:1.6}
.prose pre code{background:none;padding:0;font-size:inherit;color:inherit}
.prose img{border-radius:18px;margin-inline:auto;height:auto}
.prose hr{border:0;height:1px;background:var(--line);margin-block:2.4em}
.prose .tbl{overflow-x:auto}
.prose table{border-collapse:collapse;width:100%;font-size:15px}
.prose th,.prose td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
.prose th{color:var(--muted);font-weight:700;font-size:13px}
.post-foot{margin-top:64px;padding-top:32px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:24px}
.post-foot .tags{margin-top:0}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pn a{background:var(--bg-2);border-radius:20px;padding:20px 22px;transition:background .2s}
.pn a:hover{background:var(--bg-3)}
.pn small{display:block;color:var(--muted);font-weight:700;font-size:13px}
.pn b{display:block;margin-top:4px;font-size:16px;line-height:1.4}
.pn .next{text-align:right;grid-column:2}
.state{padding-block:160px 120px;text-align:center}
.state h1{font-size:32px;font-weight:800;letter-spacing:-.03em}
.state p{color:var(--sub);margin-top:12px}
@media (max-width:600px){ .post-wrap{padding-inline:20px} .post-head{padding-top:100px} .prose{font-size:17px} .pn{grid-template-columns:1fr} .pn .next{grid-column:auto} }
</style>
</head>
<body data-page="blog">
<main id="main"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/blog.js"></script>
<script>
const id = new URLSearchParams(location.search).get("id");
const post = validId(id) && ALL_POSTS.find(p => p.id === id);
const listHref = "blog.html" + (SHOW_DRAFTS ? "?drafts" : "");
const postHref = p => `post.html?id=${encodeURIComponent(p.id)}${SHOW_DRAFTS ? "&drafts" : ""}`;
const main = $("#main");

function stateView(title, msg){
  main.innerHTML = `<section class="state"><div class="post-wrap"><h1>${title}</h1><p>${msg}</p>
    <div class="btn-row" style="justify-content:center"><a class="btn btn-primary" href="${listHref}">Back to Blog</a></div></div></section>`;
}

if (!post) stateView("Post not found", "It may have been moved or removed.");
else {
  document.title = `${post.t} · IMM Lab Blog`;
  const i = POSTS.indexOf(post), newer = POSTS[i-1], older = POSTS[i+1];
  main.innerHTML = `
    <article class="post-wrap">
      <header class="post-head">
        <a class="back" href="${listHref}">← Blog</a>
        <div style="margin-top:20px">${catBadge(post.cat)}</div>
        <h1>${esc(post.t)}</h1>
        <div class="meta">${byline(post, 40)}<span id="readTime"></span></div>
        ${post.draft ? `<div class="draft-note">Draft — not listed on the blog yet. Remove <code>draft:true</code> in data.js to publish.</div>` : ""}
      </header>
      ${post.cover ? `<figure class="post-cover"><img src="${esc(post.cover)}" alt="" onerror="this.parentNode.remove()"></figure>` : ""}
      <div class="prose" id="body"><p style="color:var(--muted)">Loading…</p></div>
      <footer class="post-foot">
        ${(post.tags||[]).length ? `<div class="tags">${post.tags.map(t => `<span class="tag">#${esc(t)}</span>`).join("")}</div>` : ""}
        <div class="btn-row" style="margin-top:0"><button class="btn btn-ghost btn-sm" id="share">Copy link</button></div>
        ${i >= 0 && (newer || older) ? `<nav class="pn">
          ${older ? `<a href="${postHref(older)}"><small>← Previous</small><b>${esc(older.t)}</b></a>` : ""}
          ${newer ? `<a class="next" href="${postHref(newer)}"><small>Next →</small><b>${esc(newer.t)}</b></a>` : ""}
        </nav>` : ""}
      </footer>
    </article>
    <div style="height:120px"></div>`;

  $("#share").onclick = async () => {
    const url = location.href.replace(/[?&]drafts\b/, "");
    toast(await copyText(url) ? "Link copied" : url);
  };

  /* load and render posts/<id>.md — images and links are relative to the posts/ folder */
  const base = new URL(`posts/${post.id}.md`, location.href);
  fetch(base, {cache:"no-cache"})
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(md => {
      const body = $("#body");
      body.innerHTML = DOMPurify.sanitize(marked.parse(md, {gfm:true}));
      const fix = (el, attr) => {
        const v = el.getAttribute(attr);
        if (!v || /^([a-z]+:|\/|#)/i.test(v)) return;
        el.setAttribute(attr, /^(assets|posts)\//.test(v) ? v : new URL(v, base).href);
      };
      $$("img", body).forEach(im => { fix(im, "src"); im.loading = "lazy"; });
      $$("a[href]", body).forEach(a => { fix(a, "href"); if (a.host && a.host !== location.host){ a.target = "_blank"; a.rel = "noopener"; } });
      $$("table", body).forEach(t => { const w = document.createElement("div"); w.className = "tbl"; t.replaceWith(w); w.appendChild(t); });
      const words = body.textContent.trim().split(/\s+/).length;
      $("#readTime").textContent = `· ${Math.max(1, Math.round(words / 200))} min read`;
    })
    .catch(() => {
      $("#body").innerHTML = `<p style="color:var(--muted)">Couldn't load this post. ${location.protocol === "file:" ? "Open the site through a local server (python3 -m http.server) — browsers block reading files directly." : "Check that <code>posts/" + esc(post.id) + ".md</code> exists."}</p>`;
    });
}
</script>
</body>
</html>
